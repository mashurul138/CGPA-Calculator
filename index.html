<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CGPA Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="title-block">
          <h1>📊 CGPA Calculator</h1>
        </div>

        <div class="fab-toolbar" aria-hidden="false">
          <div class="fab save" title="Save data (Ctrl+S)" onclick="saveCGPA()">💾</div>
          <div class="fab load" title="Load data" onclick="document.getElementById('loadFile').click()">📁
          </div>
          <div class="fab pdf" title="Export PDF" onclick="exportToPDF()">📄</div>
          <div class="fab img" title="Export Image" onclick="exportToImage()">🖼️</div>
          <div class="fab clear" title="Clear all" onclick="clearAll()">🗑️</div>
        </div>
      </div>

      <div class="main-content">
        <!-- Add Course Section -->
        <div class="add-course-section">
          <h2>Add New Course</h2>
          <form id="courseForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="courseName">Course Name *</label>
                <input
                  type="text"
                  id="courseName"
                  placeholder="e.g., Mathematics"
                  required
                />
              </div>
              <div class="form-group">
                <label for="credits">Credits *</label>
                <input
                  type="number"
                  id="credits"
                  min="0.5"
                  max="10"
                  step="0.5"
                  placeholder="e.g., 3"
                  required
                />
              </div>
              <div class="form-group">
                <label for="gpa">GPA *</label>
                <input
                  type="number"
                  id="gpa"
                  min="0"
                  max="4"
                  step="0.01"
                  placeholder="e.g., 3.75"
                  required
                />
              </div>
            </div>
            <div class="controls">
              <button type="submit" class="btn btn-primary" id="addCourseBtn">
                ➕ Add Course
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                onclick="clearForm()"
              >
                🔄 Clear Form
              </button>
            </div>
          </form>
        </div>

        <!-- Control Buttons -->
        <div class="controls">
          <button class="btn btn-secondary" onclick="saveCGPA()">
            💾 Save Data
          </button>
          <label for="loadFile" class="file-input-label">📁 Load Data</label>
          <input
            type="file"
            id="loadFile"
            class="file-input"
            accept=".json"
            onchange="loadCGPA(event)"
          />
          <button class="btn btn-secondary" onclick="exportToPDF()">
            📄 Export PDF
          </button>
          <button class="btn btn-secondary" onclick="exportToImage()">
            🖼️ Export Image
          </button>
          <button class="btn btn-danger" onclick="clearAll()">
            🗑️ Clear All
          </button>
        </div>

        <div class="cgpa-display">
          <div class="cgpa-value" id="cgpaValue">0.00</div>
          <div class="cgpa-label">Current CGPA</div>
        </div>

        <div class="stats">
          <div class="stat-card">
            <div class="stat-value" id="totalCourses">0</div>
            <div class="stat-label">Total Courses</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="totalCredits">0</div>
            <div class="stat-label">Total Credits</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="avgGPA">0.00</div>
            <div class="stat-label">Average GPA</div>
          </div>
        </div>

        <div class="courses-table">
          <table id="coursesTable">
            <thead>
              <tr>
                <th>Course Name</th>
                <th>Credits</th>
                <th>GPA</th>
                <th>Grade Points</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="coursesTableBody"></tbody>
          </table>
          <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">📚</div>
            <h3>No courses added yet</h3>
            <p>Fill out the form above to add your first course</p>
          </div>
        </div>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Processing...</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
